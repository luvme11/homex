<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Home</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--ink:#2a2a2a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard Variable',system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,#f4f4f4 0%,#fff 60%);min-height:100vh;display:flex;justify-content:center;padding:70px 0}
button,input,textarea{font:inherit;color:inherit}button{background:none;border:0;cursor:pointer}
a{color:inherit}
main{display:grid;grid-template-columns:250px minmax(0,1fr);gap:64px;width:min(1040px,calc(100vw - 148px))}
.pg-title{font-size:38px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.pg-sub{font-size:8px;letter-spacing:.3em;color:#888;margin-top:10px}
.av{width:112px;height:112px;margin-top:30px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 1px #ddd,0 8px 20px -8px rgba(0,0,0,.28);background:#e4e4e4;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.nm{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-top:16px}
.hd{font-size:8px;letter-spacing:.3em;color:#888;margin-top:6px}
.bar{display:flex;align-items:flex-end;justify-content:space-between;height:62px}
.tabs{display:flex;align-items:flex-end}
.tab{position:relative;height:36px;padding:0 18px 3px;font-size:11px;font-weight:700;color:#777;display:flex;align-items:center}
.tab:hover{color:#222}
.tab.on{height:40px;margin-bottom:-1px;background:#fff;color:#111;border-radius:16px 16px 0 0;padding-bottom:6px}
.tab.on::after{content:"";position:absolute;left:50%;bottom:5px;width:3px;height:3px;margin-left:-1.5px;border-radius:50%;background:#222}
.tab.on i{position:absolute;bottom:0;width:16px;height:16px}
.tab.on i.l{left:-16px;background:radial-gradient(circle at 0 0,transparent 16px,#fff 16.5px)}
.tab.on i.r{right:-16px;background:radial-gradient(circle at 100% 0,transparent 16px,#fff 16.5px)}
.tab.on:first-child i.l{display:none}
.cnt{margin-bottom:6px;display:flex;align-items:baseline;gap:5px}
.cnt b{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1}
.cnt small{font-size:9px;font-weight:700;letter-spacing:.15em;color:#777}
.card{display:flex;flex-direction:column;background:#fff;border-radius:24px;overflow:hidden;height:clamp(380px,calc(100vh - 300px),700px);box-shadow:0 26px 40px -20px rgba(0,0,0,.22),0 2px 10px rgba(0,0,0,.04)}
.card.f1{border-top-left-radius:0}
.body{flex:1;min-height:0;overflow-y:auto;padding:22px 26px 26px 24px;scrollbar-width:thin;scrollbar-color:#cfcfcf transparent}
.sh{display:flex;align-items:center;gap:10px}
.sh em{font-style:normal;background:#2a2a2a;color:#fff;font-size:8.5px;font-weight:700;border-radius:10px;height:19px;padding:0 8px;display:grid;place-items:center}
.sh h3{font-size:16px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sh i{flex:1;border-top:1px solid #ddd}
.sh span{font-size:8px;font-weight:600;letter-spacing:.3em;color:#777;white-space:nowrap}
.it{margin-bottom:30px}
.it img.th{display:block;max-height:240px;object-fit:cover;border-radius:14px;margin:14px 0 0 33px;width:calc(100% - 33px);cursor:zoom-in}
.ab{margin:14px 0 0 33px;font-size:12px;line-height:1.85;color:#444;white-space:pre-wrap;word-break:break-word}
.st{display:flex;margin:18px 0 0 33px}.st div{padding:0 26px;border-left:1px solid #ddd}.st div:first-child{padding-left:0;border:0}
.st small{display:block;font-size:8px;font-weight:700;letter-spacing:.2em;color:#777}.st b{display:block;font-size:20px;font-weight:800;margin-top:3px;word-break:break-all}
.chips,.ft{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 0 33px;align-items:center}
.tg{font-size:8.5px;font-weight:700;letter-spacing:.08em;padding:3px 8px;border-radius:10px;border:1px solid #ccc;color:#888}
.cp{height:26px;padding:0 13px;border:1px solid #ddd;border-radius:13px;font-size:9.5px;font-weight:700;color:#555;display:inline-grid;place-items:center;text-decoration:none}
.cp:hover{border-color:#2a2a2a;color:#111}.cp.dk{background:#2a2a2a;border-color:#2a2a2a;color:#fff}
.tx{margin:14px 0 0 33px;padding:12px 16px;background:#2a2a2a;color:#eee;border-radius:14px;font-size:11.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.cb{margin:14px 0 0 33px;display:flex;flex-direction:column;gap:8px}
.cr{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid #e6e6e6;border-radius:14px;flex-wrap:wrap}
.cn{font-size:8.5px;font-weight:700;color:#999}.ci{flex:1;min-width:90px}
.ci small{display:block;font-size:8px;font-weight:700;letter-spacing:.15em;color:#777;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci b{font-size:18px;font-weight:800;word-break:break-all}
.dt{font-size:8px;letter-spacing:.2em;color:#999;margin:8px 0 0 33px}
.empty{font-size:11px;color:#aaa;padding:30px 0;text-align:center}
mark{background:#e6e6e6;color:inherit;border-radius:3px;padding:1px 3px}
.sr{display:flex;align-items:center;gap:10px;padding:16px 24px 0}
.sr input{flex:1;min-width:0;height:30px;border:1px solid #ddd;border-radius:15px;padding:0 14px;font-size:11px;background:#fafafa;outline:0}
.sr input:focus{border-color:#2a2a2a}
.sr small{font-size:8px;font-weight:700;letter-spacing:.2em;color:#888;white-space:nowrap}
.gd{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tl{aspect-ratio:3/4;border-radius:14px;overflow:hidden;background:#ececec;border:1px solid #e6e6e6;cursor:zoom-in;position:relative}
.tl img{width:100%;height:100%;object-fit:cover;display:block}
.cap{font-size:10.5px;font-weight:700;margin:6px 2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pgn{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:4px;margin:22px 0 4px}
.pgn button{min-width:26px;height:26px;padding:0 6px;border-radius:13px;font-size:10px;font-weight:700;color:#777}
.pgn button:hover:not(:disabled){background:#f0f0f0;color:#111}.pgn button.on{background:#2a2a2a;color:#fff}.pgn button:disabled{opacity:.25;cursor:default}
.heart{position:fixed;top:22px;right:38px;font-size:15px;color:#b9b9b9;text-decoration:none}.heart:hover{color:#666}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;place-items:center;z-index:50;padding:20px 60px}.lb.on{display:grid}
.lb img{max-width:100%;max-height:calc(100vh - 80px);border-radius:10px;user-select:none;-webkit-user-drag:none}
.ar{position:absolute;top:50%;width:40px;height:40px;margin-top:-20px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;font-size:20px;line-height:1}.ar:hover{background:rgba(255,255,255,.3)}
.ar.l{left:12px}.ar.r{right:12px}
.lc{position:absolute;bottom:18px;left:0;right:0;text-align:center;font-size:10px;font-weight:700;letter-spacing:.2em;color:#ddd}
.tl .bd,.tl .pv2{position:absolute;z-index:2;font-size:8.5px;font-weight:800;letter-spacing:.08em;padding:3px 8px;border-radius:10px;background:rgba(255,255,255,.93);color:#333}
.tl .bd{right:8px;bottom:8px}.tl .pv2{left:8px;top:8px;background:rgba(42,42,42,.85);color:#fff}
@media (max-width:1000px){.lb{padding:20px 10px}.ar{display:none!important}}
@media (max-width:1000px){
  body{padding:30px 0}main{grid-template-columns:1fr;gap:26px;width:calc(100vw - 32px)}
  .card{height:auto}.body{overflow:visible}.sh i{display:none}
  .ab,.st,.chips,.ft,.tx,.dt,.cb{margin-left:0}.it img.th{margin-left:0;width:100%}
  .pg-title{font-size:32px}.heart{right:20px}.gd{grid-template-columns:repeat(2,minmax(0,1fr))}
}
</style>
</head>
<body>
<a class="heart" href="home-admin.html" aria-label="admin">♡</a>
<main>
  <aside>
    <h1 class="pg-title" id="title"></h1>
    <p class="pg-sub" id="sub"></p>
    <div class="av" id="av"></div>
    <div class="nm" id="nm"></div>
    <div class="hd" id="hd"></div>
  </aside>
  <section>
    <div class="bar"><div class="tabs" id="tabs"></div><div class="cnt"><b id="cur">01</b><small id="tot"></small></div></div>
    <div class="card" id="card"><div class="sr"><input id="q" placeholder="이름·태그 검색"><small id="rc"></small></div><div class="body" id="body"></div></div>
  </section>
</main>
<div class="lb" id="lb"><button class="ar l" id="lp">‹</button><img alt=""><button class="ar r" id="ln">›</button><div class="lc" id="lc"></div></div>

<script>document.write('<script src="home-data.js?t='+Date.now()+'"><\/script>')</script>
<script>
const $ = s => document.querySelector(s), pad = n => String(n).padStart(2,'0');
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hl = s => esc(s).replace(/==(.+?)==/g, '<mark>$1</mark>');
const D = window.HOME_DATA || {}, ITEMS = D.items || [];
const P = Object.assign({title:'My\nHome',sub:'LORA · BOARD · ASSETS',name:'',handle:'',avatar:'',text:'',tags:[]}, D.profile || {});
const TABS = [{k:'intro',label:'소개'},{k:'lora',label:'로라'},{k:'post',label:'게시판'},{k:'asset',label:'에셋',grid:1}];
const SIZE = {lora:6, post:6, asset:12};
/* 관리자(토큰이 저장된 브라우저)만 비공개 에셋을 볼 수 있음 */
const OWNER = (() => { try{ const g = JSON.parse(localStorage.getItem('home_gh') || '{}'); return !!(g.owner && g.repo && g.token); }catch(e){ return false; } })();
const imgsOf = p => p.imgs && p.imgs.length ? p.imgs : (p.img ? [p.img] : []);
let T = 0, Q = '', PG = 1;
$('#title').innerHTML = P.title.split('\n').map(esc).join('<br>');
$('#sub').textContent = P.sub; $('#nm').textContent = P.name; $('#hd').textContent = P.handle;
if (P.avatar) $('#av').innerHTML = `<img src="${esc(P.avatar)}" alt="">`;
document.title = P.title.replace('\n',' ');
if (P.favicon){ let l = document.querySelector('link[rel~=icon]'); if (!l){ l = document.createElement('link'); l.rel = 'icon'; document.head.appendChild(l); } l.href = P.favicon; }
const fmt = t => { const d = new Date(t||0); return isNaN(d)||!t ? '' : d.getFullYear()+'.'+pad(d.getMonth()+1)+'.'+pad(d.getDate()); };

function pager(pg, pages){
  if (pages < 2) return '';
  const s = Math.floor((pg-1)/10)*10 + 1, e = Math.min(pages, s+9), n = [];
  for (let i=s;i<=e;i++) n.push(`<button data-p="${i}" class="${i===pg?'on':''}">${i}</button>`);
  return `<div class="pgn"><button data-p="1" ${pg<2?'disabled':''}>«</button><button data-p="${pg-1}" ${pg<2?'disabled':''}>‹</button>${n.join('')}<button data-p="${pg+1}" ${pg>=pages?'disabled':''}>›</button><button data-p="${pages}" ${pg>=pages?'disabled':''}>»</button></div>`;
}
const sortNew = a => a.slice().sort((x,y) => (y.at||0) - (x.at||0));
const combosOf = p => p.links && p.links.length ? p.links : (p.url||p.weight ? [{url:p.url,weight:p.weight}] : []);
const loraRow = (p,n) => `<div class="it"><div class="sh"><em>${pad(n)}</em><h3>${hl(p.name||'이름 없음')}</h3><i></i><span>LORA</span></div>
  ${p.img?`<img class="th" src="${esc(p.img)}" style="object-position:${esc(p.pos||'50% 50%')}" loading="lazy" alt="" onerror="this.remove()">`:''}
  <div class="cb">${combosOf(p).map((c,i)=>`<div class="cr"><span class="cn">${pad(i+1)}</span><div class="ci"><small>${esc(c.label||'LORA '+(i+1))} · WEIGHT</small><b>${esc(c.weight||'-')}</b></div>${c.url?`<a class="cp dk" href="${esc(c.url)}" target="_blank" rel="noopener">Pix AI ↗</a>`:''}<button class="cp" data-copy="${esc(c.weight||'')}">비중 복사</button></div>`).join('')}</div>
  ${p.trigger?`<div class="st"><div><small>TRIGGER</small><b style="font-size:13px;line-height:1.5">${esc(p.trigger)}</b></div></div>`:''}
  ${p.note?`<div class="ab">${hl(p.note)}</div>`:''}
  ${(p.tags||[]).length?`<div class="chips">${p.tags.map(g=>`<span class="tg">${esc(g)}</span>`).join('')}</div>`:''}
  ${p.trigger?`<div class="ft"><button class="cp" data-copy="${esc(p.trigger)}">트리거 복사</button></div>`:''}</div>`;
const postRow = (p,n) => `<div class="it"><div class="sh"><em>${pad(n)}</em><h3>${hl(p.title||'제목 없음')}</h3><i></i><span>POST</span></div>
  <div class="dt">${fmt(p.at)}</div>
  ${p.img?`<img class="th" src="${esc(p.img)}" loading="lazy" alt="" onerror="this.remove()">`:''}
  <div class="ab">${hl(p.body||'')}</div></div>`;
const tile = p => { const n = imgsOf(p).length; return `<div><div class="tl" data-s="${esc(p.id)}"><img src="${esc(imgsOf(p)[0]||'')}" loading="lazy" alt="" onerror="this.remove()">${p.hidden?'<div class="pv2">비공개</div>':''}${n>1?`<div class="bd">1 / ${n}</div>`:''}</div>${p.name?`<div class="cap">${esc(p.name)}</div>`:''}</div>`; };

function render(){
  $('#tabs').innerHTML = TABS.map((t,i)=>`<button class="tab${i===T?' on':''}" data-t="${i}">${esc(t.label)}${i===T?'<i class="l"></i><i class="r"></i>':''}</button>`).join('');
  $('#cur').textContent = pad(T+1); $('#tot').textContent = '/ ' + pad(TABS.length);
  $('#card').classList.toggle('f1', T===0);
  const t = TABS[T], intro = t.k === 'intro';
  $('.sr').style.display = intro ? 'none' : 'flex';
  if (intro){
    $('#body').innerHTML = `<div class="sh"><em>01</em><h3>ABOUT</h3><i></i><span>INTRO</span></div>
      <div class="ab">${P.text ? hl(P.text) : '소개글을 관리자 페이지에서 적어 주세요.'}</div>
      ${(P.tags||[]).length ? `<div class="chips">${P.tags.map(g=>`<span class="tg">${esc(g)}</span>`).join('')}</div>` : ''}`;
    return;
  }
  const q = Q.toLowerCase(), all = sortNew(ITEMS.filter(i=>i.tab===t.k && (OWNER || !i.hidden)));
  const list = all.filter(p => !q || [p.name,p.title,p.note,p.body,p.trigger,(p.tags||[]).join(' ')].join(' ').toLowerCase().includes(q));
  const size = SIZE[t.k], pages = Math.max(1, Math.ceil(list.length/size));
  PG = Math.min(PG, pages);
  const off = (PG-1)*size, cur = list.slice(off, off+size);
  $('#rc').textContent = list.length + ' / ' + all.length;
  const html = t.k==='lora' ? cur.map((p,i)=>loraRow(p, list.length-off-i)).join('')
    : t.k==='post' ? cur.map((p,i)=>postRow(p, list.length-off-i)).join('')
    : `<div class="gd">${cur.map(tile).join('')}</div>`;
  $('#body').innerHTML = !list.length ? '<div class="empty">'+(all.length?'검색 결과가 없어요':'아직 올린 게 없어요')+'</div>' : html + pager(PG, pages);
}
async function copy(txt){
  try{ await navigator.clipboard.writeText(txt); }catch(x){ const a=document.createElement('textarea'); a.value=txt; document.body.appendChild(a); a.select(); try{document.execCommand('copy')}catch(y){} a.remove(); }
}
$('#tabs').onclick = e => { const b = e.target.closest('[data-t]'); if(!b) return; T = +b.dataset.t; Q = ''; PG = 1; $('#q').value = ''; render(); $('#body').scrollTop = 0; };
$('#q').oninput = e => { Q = e.target.value.trim(); PG = 1; render(); };
$('#body').onclick = async e => {
  const p = e.target.closest('[data-p]');
  if (p && !p.disabled){ PG = +p.dataset.p; render(); $('#body').scrollTop = 0; window.scrollTo(0,0); return; }
  const z = e.target.closest('[data-s]');
  if (z){ const it = ITEMS.find(x => x.id === z.dataset.s); if (it) openLb(imgsOf(it), 0); return; }
  const im = e.target.closest('img.th'); if (im){ openLb([im.src], 0); return; }
  const c = e.target.closest('[data-copy]'); if (!c) return;
  await copy(c.dataset.copy); const o = c.textContent; c.textContent = '복사됨 ✓'; setTimeout(()=>c.textContent = o, 1200);
};
/* 슬라이드 뷰어: 화살표 · 키보드 · 스와이프 */
let G = [], GI = 0, TX = null;
function showLb(){ $('#lb img').src = G[GI]; $('#lc').textContent = G.length > 1 ? pad(GI+1) + ' / ' + pad(G.length) : ''; $('#lp').style.display = $('#ln').style.display = G.length > 1 ? '' : 'none'; }
function openLb(a, i){ G = a; GI = i; showLb(); $('#lb').classList.add('on'); }
const go = d => { if (G.length > 1){ GI = (GI + d + G.length) % G.length; showLb(); } };
$('#lb').onclick = () => $('#lb').classList.remove('on');
$('#lp').onclick = e => { e.stopPropagation(); go(-1); }; $('#ln').onclick = e => { e.stopPropagation(); go(1); };
$('#lb img').onclick = e => { e.stopPropagation(); go(1); };
document.addEventListener('keydown', e => { if (!$('#lb').classList.contains('on')) return; if (e.key === 'Escape') $('#lb').classList.remove('on'); if (e.key === 'ArrowLeft') go(-1); if (e.key === 'ArrowRight') go(1); });
$('#lb').addEventListener('touchstart', e => { TX = e.touches[0].clientX; }, {passive:true});
$('#lb').addEventListener('touchend', e => { if (TX == null) return; const d = e.changedTouches[0].clientX - TX; TX = null; if (Math.abs(d) > 40) go(d < 0 ? 1 : -1); });
render();
</script>
</body>
</html>
